<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050608">
    <title>YP23 CREW — Yapping Youth Crew 23</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
         :root {
            --black: #050608;
            --navy: #0a2260;
            --navy-2: #123a99;
            --blue: #6b95ff;
            --white: #ffffff;
            --mist: #eef2fa;
            --ink: #0a1020;
            --muted: #5a6580;
            --line: #d9e0ef;
            --display: "Bricolage Grotesque", "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            --body: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        
        * {
            box-sizing: border-box
        }
        
        html {
            scroll-behavior: smooth
        }
        
        body {
            margin: 0;
            background: var(--white);
            color: var(--ink);
            font-family: var(--body);
            font-size: 16px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%
        }
        
        button,
        a {
            font: inherit
        }
        
        a {
            color: inherit
        }
        
        img {
            max-width: 100%;
            display: block
        }
        
         :focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 3px;
            border-radius: 6px
        }
        /* ---------- Layout ---------- */
        
        .layout {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 248px minmax(0, 1fr)
        }
        
        .sidebar {
            background: var(--black);
            color: var(--white);
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px 30px
        }
        
        .logo-slot {
            position: relative;
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            border-radius: 13px;
            background: var(--navy-2);
            display: grid;
            place-items: center;
            overflow: hidden;
            font-family: var(--display);
            font-weight: 800;
            font-size: 17px
        }
        
        .logo-slot img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: var(--black)
        }
        
        .brand-name {
            font-family: var(--display);
            font-weight: 800;
            font-size: 19px;
            line-height: 1.1;
            letter-spacing: -.02em
        }
        
        .brand-tag {
            font-size: 12px;
            color: #9aa6c4;
            margin-top: 3px;
            line-height: 1.3
        }
        
        .nav {
            display: grid;
            gap: 6px
        }
        
        .nav button {
            border: 0;
            background: transparent;
            color: #cfd7ea;
            text-align: left;
            padding: 12px 16px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background .18s, color .18s
        }
        
        .nav button[aria-current="page"] {
            background: var(--white);
            color: var(--black);
            font-weight: 700
        }
        
        .nav svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0
        }
        
        @media(hover:hover) {
            .nav button:not([aria-current]):hover {
                background: #ffffff14;
                color: #fff
            }
        }
        
        main {
            min-width: 0;
            padding: 32px clamp(20px, 4.5vw, 64px) 56px;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto
        }
        
        .page {
            display: none
        }
        
        .page.active {
            display: block
        }
        /* ---------- Tombol ---------- */
        
        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--white);
            border-radius: 999px;
            padding: 11px 22px;
            background: var(--white);
            color: var(--black);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background .18s, color .18s
        }
        
        .btn.ghost {
            background: transparent;
            color: var(--white)
        }
        
        .btn.dark {
            background: var(--black);
            border-color: var(--black);
            color: var(--white)
        }
        
        @media(hover:hover) {
            .btn:hover {
                background: transparent;
                color: var(--white)
            }
            .btn.ghost:hover {
                background: var(--white);
                color: var(--black)
            }
            .btn.dark:hover {
                background: transparent;
                color: var(--black)
            }
        }
        /* ---------- Slot gambar (placeholder sampai gambar dimuat) ---------- */
        
        .img-slot {
            position: relative;
            overflow: hidden;
            display: grid;
            place-items: center;
            background: linear-gradient(150deg, var(--navy-2), var(--black));
            color: #ffffff66;
            font-family: var(--display);
            font-weight: 800;
            font-size: clamp(32px, 5vw, 56px);
            letter-spacing: -.04em
        }
        
        .img-slot img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover
        }
        /* ---------- Beranda ---------- */
        
        .hero {
            background: var(--navy);
            color: var(--white);
            border-radius: 28px;
            padding: clamp(24px, 4.5vw, 56px);
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(0, .8fr);
            gap: clamp(24px, 4vw, 56px);
            align-items: center
        }
        
        .hero h1 {
            font-family: var(--display);
            font-weight: 800;
            font-size: clamp(40px, 6.6vw, 100px);
            line-height: .92;
            letter-spacing: -.045em;
            margin: 0 0 20px
        }
        
        .hero h1 span {
            display: block
        }
        
        .hero h1 .stroke {
            color: transparent;
            -webkit-text-stroke: 2px var(--white)
        }
        
        .hero p {
            margin: 0 0 26px;
            max-width: 30ch;
            color: #cdd8f3;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .04em;
            line-height: 1.5
        }
        
        .cover {
            aspect-ratio: 4/5;
            max-height: 480px;
            width: 100%;
            border-radius: 20px;
            justify-self: end
        }
        
        .block {
            margin-top: 56px
        }
        
        .block h2 {
            font-family: var(--display);
            font-weight: 800;
            font-size: clamp(26px, 3.2vw, 38px);
            letter-spacing: -.035em;
            line-height: 1.1;
            margin: 0 0 16px
        }
        
        #profil {
            scroll-margin-top: 24px
        }
        
        .profile-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr);
            gap: clamp(24px, 4vw, 56px);
            align-items: center
        }
        
        .lead {
            margin: 0;
            max-width: 62ch;
            color: #323c55;
            line-height: 1.75
        }
        
        .about-img {
            aspect-ratio: 1/1;
            border-radius: 20px;
            width: 100%
        }
        
        .explore {
            border-top: 2px solid var(--black)
        }
        
        .explore-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 20px 4px;
            background: none;
            border: 0;
            border-bottom: 1px solid var(--line);
            text-align: left;
            cursor: pointer;
            color: inherit;
            transition: background .18s, padding .18s
        }
        
        .explore-row strong {
            font-family: var(--display);
            font-weight: 800;
            font-size: clamp(28px, 4vw, 44px);
            letter-spacing: -.04em;
            line-height: 1
        }
        
        .explore-row .go {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--navy);
            color: #fff;
            display: grid;
            place-items: center
        }
        
        .explore-row .go svg {
            width: 18px;
            height: 18px
        }
        
        @media(hover:hover) {
            .explore-row:hover {
                background: var(--mist);
                padding-left: 16px;
                padding-right: 16px
            }
        }
        /* ---------- Halaman dalam ---------- */
        
        .page-head {
            background: var(--navy);
            color: var(--white);
            border-radius: 28px;
            padding: clamp(24px, 4.5vw, 44px) clamp(24px, 4.5vw, 52px)
        }
        
        .page-head h1 {
            font-family: var(--display);
            font-weight: 800;
            font-size: clamp(44px, 7vw, 80px);
            letter-spacing: -.05em;
            line-height: .95;
            margin: 0
        }
        
        .list {
            display: grid;
            gap: 10px;
            margin-top: 20px
        }
        
        .item {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--white);
            transition: border-color .18s, background .18s
        }
        
        @media(hover:hover) {
            .item:hover {
                border-color: var(--navy-2);
                background: var(--mist)
            }
        }
        
        .item-icon {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: var(--navy);
            color: #fff;
            display: grid;
            place-items: center
        }
        
        .item-icon svg {
            width: 20px;
            height: 20px
        }
        
        .item.song .item-icon {
            border-radius: 50%
        }
        
        .item strong {
            display: block;
            font-size: 16px;
            line-height: 1.35;
            overflow-wrap: anywhere
        }
        
        .item small {
            display: block;
            color: var(--muted);
            margin-top: 3px;
            font-size: 13px;
            line-height: 1.45
        }
        
        .act {
            border: 2px solid var(--black);
            background: var(--black);
            color: #fff;
            border-radius: 999px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background .18s, color .18s;
            white-space: nowrap
        }
        
        @media(hover:hover) {
            .act:hover {
                background: transparent;
                color: var(--black)
            }
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 20px
        }
        
        .tile {
            border: 0;
            padding: 0;
            border-radius: 16px;
            overflow: hidden;
            cursor: zoom-in;
            aspect-ratio: 4/3;
            background: none
        }
        
        .tile .img-slot {
            width: 100%;
            height: 100%
        }
        
        .tile img {
            transition: transform .35s
        }
        
        @media(hover:hover) {
            .tile:hover img {
                transform: scale(1.04)
            }
        }
        
        .gallery-actions {
            margin-top: 20px
        }
        /* ---------- Dialog & toast ---------- */
        
        dialog {
            border: 0;
            padding: 0;
            background: transparent;
            max-width: min(960px, 94vw);
            width: 100%;
            overflow: visible
        }
        
        dialog::backdrop {
            background: #050608d9
        }
        
        .dlg {
            background: var(--black);
            color: #fff;
            border-radius: 20px;
            padding: 12px
        }
        
        .dlg-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 4px 6px 12px
        }
        
        .dlg-bar strong {
            font-family: var(--display);
            font-size: 16px;
            line-height: 1.3;
            overflow-wrap: anywhere
        }
        
        .dlg-bar .x {
            flex-shrink: 0;
            border: 0;
            background: #ffffff1f;
            color: #fff;
            border-radius: 999px;
            padding: 7px 16px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px
        }
        
        @media(hover:hover) {
            .dlg-bar .x:hover {
                background: #fff;
                color: #000
            }
        }
        
        .frame {
            aspect-ratio: 16/9;
            width: 100%;
            border: 0;
            border-radius: 12px;
            background: #000;
            display: block
        }
        
        .dlg img.big {
            width: 100%;
            max-height: 72vh;
            object-fit: contain;
            border-radius: 12px;
            background: #000
        }
        
        .dlg-foot {
            padding: 12px 6px 2px;
            font-size: 13px;
            color: #b6c1dc;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap
        }
        
        .dlg-foot a {
            color: #fff;
            font-weight: 700
        }
        
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 30px);
            background: var(--black);
            color: #fff;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 14px;
            max-width: min(92vw, 420px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 60;
            box-shadow: 0 8px 30px #0006
        }
        
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0)
        }
        /* ---------- Mobile & tablet: header ringkas + tab bawah ---------- */
        
        @media(max-width:900px) {
            .layout {
                grid-template-columns: 1fr
            }
            .sidebar {
                height: auto;
                flex-direction: row;
                align-items: center;
                z-index: 30;
                padding: 10px 16px
            }
            .brand {
                padding: 0;
                gap: 10px
            }
            .logo-slot {
                width: 38px;
                height: 38px;
                border-radius: 11px;
                font-size: 15px
            }
            .brand-name {
                font-size: 17px
            }
            .brand-tag {
                font-size: 11px;
                margin-top: 1px
            }
            .nav {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 40;
                grid-template-columns: repeat(4, 1fr);
                gap: 4px;
                padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
                background: var(--black);
                border-top: 1px solid #ffffff24
            }
            .nav button {
                flex-direction: column;
                justify-content: center;
                gap: 3px;
                padding: 8px 4px;
                border-radius: 14px;
                font-size: 12px;
                text-align: center
            }
            .nav svg {
                width: 22px;
                height: 22px
            }
            main {
                padding: 20px 16px calc(92px + env(safe-area-inset-bottom))
            }
            .toast {
                bottom: calc(86px + env(safe-area-inset-bottom))
            }
            .hero {
                grid-template-columns: 1fr;
                border-radius: 24px
            }
            .hero h1 {
                font-size: clamp(44px, 14vw, 80px)
            }
            .cover {
                justify-self: stretch;
                aspect-ratio: 4/3;
                max-height: none
            }
            .block {
                margin-top: 44px
            }
            .profile-grid {
                grid-template-columns: 1fr
            }
            .about-img {
                aspect-ratio: 4/3
            }
            .page-head {
                border-radius: 24px
            }
        }
        
        @media(max-width:560px) {
            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px
            }
            .tile {
                border-radius: 12px
            }
            .item {
                padding: 12px;
                gap: 12px;
                border-radius: 16px
            }
            .item-icon {
                width: 40px;
                height: 40px;
                border-radius: 11px
            }
            .item.song .item-icon {
                border-radius: 50%
            }
            .act {
                padding: 7px 14px;
                font-size: 13px
            }
            .btn {
                padding: 10px 18px;
                font-size: 14px
            }
        }
        
        @media(prefers-reduced-motion:reduce) {
            html {
                scroll-behavior: auto
            }
            * {
                transition: none!important
            }
        }
    </style>
</head>

<body>
    <div class="layout">

        <aside class="sidebar">
            <div class="brand">
                <div class="logo-slot" id="logo-slot" aria-hidden="true">YP</div>
                <div>
                    <div class="brand-name">YP23 CREW</div>
                    <div class="brand-tag">Yapping Youth Crew 23</div>
                </div>
            </div>
            <nav class="nav" aria-label="Navigasi utama">
                <button data-page="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Beranda</button>
                <button data-page="zine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M9 9h6M9 13h6"/></svg>Zine</button>
                <button data-page="song"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z" fill="currentColor"/></svg>Song</button>
                <button data-page="galeri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>Galeri</button>
            </nav>
        </aside>

        <main id="main">

            <!-- ============ BERANDA + PROFIL ============ -->
            <section class="page active" id="page-home">
                <div class="hero">
                    <div>
                        <h1><span>YAPPING</span><span>YOUTH</span><span class="stroke">CREW 23</span></h1>
                        <p>WE STAND AS ONE ON AND OFF THE GROUND</p>
                        <div class="btn-row">
                            <a class="btn" href="#profil" id="btn-profil">Tentang kami</a>
                            <a class="btn ghost" href="#galeri" data-go="galeri">Lihat galeri</a>
                        </div>
                    </div>
                    <div class="img-slot cover" id="cover-slot">YP23</div>
                </div>

                <div class="block" id="profil">
                    <div class="profile-grid">
                        <div>
                            <h2>YP23 Crew</h2>
                            <p class="lead" id="profile-story"></p>
                        </div>
                        <div class="img-slot about-img" id="about-slot">YP23</div>
                    </div>
                </div>

                <div class="block">
                    <h2>Jelajahi ruang kami</h2>
                    <div class="explore">
                        <button class="explore-row" data-go="zine"><strong>Zine</strong><i class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></button>
                        <button class="explore-row" data-go="song"><strong>Song</strong><i class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></button>
                        <button class="explore-row" data-go="galeri"><strong>Galeri</strong><i class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></button>
                    </div>
                </div>
            </section>

            <!-- ============ ZINE ============ -->
            <section class="page" id="page-zine">
                <div class="page-head">
                    <h1>Zine</h1>
                </div>
                <div class="list" id="zine-list"></div>
            </section>

            <!-- ============ SONG ============ -->
            <section class="page" id="page-song">
                <div class="page-head">
                    <h1>Song</h1>
                </div>
                <div class="list" id="song-list"></div>
            </section>

            <!-- ============ GALERI ============ -->
            <section class="page" id="page-galeri">
                <div class="page-head">
                    <h1>Galeri</h1>
                </div>
                <div class="gallery" id="gallery"></div>
                <div class="btn-row gallery-actions"><a class="btn dark" href="#" id="gallery-folder">Buka folder lengkap di Google Drive</a></div>
            </section>

        </main>
    </div>

    <!-- Pemutar Google Drive -->
    <dialog id="video-dialog" aria-label="Pemutar">
        <div class="dlg">
            <div class="dlg-bar"><strong id="video-title"></strong><button class="x" data-close>Tutup</button></div>
            <iframe class="frame" id="video-frame" allow="autoplay; fullscreen" allowfullscreen title="Pemutar Google Drive"></iframe>
            <div class="dlg-foot"><span>Tidak bisa diputar?</span><a id="video-open" href="#" target="_blank" rel="noopener noreferrer">Buka di Google Drive</a></div>
        </div>
    </dialog>

    <!-- Pembesar foto -->
    <dialog id="photo-dialog" aria-label="Foto">
        <div class="dlg">
            <div class="dlg-bar"><strong id="photo-title"></strong><button class="x" data-close>Tutup</button></div>
            <img class="big" id="photo-img" alt="">
        </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        /* =====================================================================
                   PUSAT PENGATURAN — ubah isi website di sini.
                   Kosongkan "" bila belum ada; tampilan cadangan muncul otomatis.
                   ===================================================================== */
        const CONFIG = {
            /* Gambar: tautan gambar langsung atau path file, mis. "doc/logo.jpeg" */
            logo: "doc/logo.jpeg", // logo kecil di sidebar (disarankan persegi)
            cover: "doc/sampul.jpeg", // gambar sampul beranda (disarankan potret 4:5)
            aboutImage: "doc/cover.jpeg", // foto di bagian profil (disarankan persegi)

            /* Profil — tampil di Beranda */
            profile: {
                story: "Mengacu pada kondisi dan situasi yang ada, YP.23 telah dibentuk sebagai ruang untuk tetap berdiri bersama-layaknya di tribun, di tengah dinamika dan drama kampus ini. Kami tumbuh dari teman teman yang menjaga solidaritas, baik di dalam maupun di luar ground kampus. Kami ada, tak hanya di laga, namun di setiap perjuangan teman teman. Tujuan dibentuknya akun ini adalah untuk menjadi ruang aman, seperti chant yang menyatukan, bagi teman-teman menyalurkan keresahan masing-masing, mulai dari drama yang tidak sehat di pitch akademik, kritik terhadap sistem kampus, hingga isu di luar kampus yang tak kalah bikin pusing."
            },

            /* Zine — tautan berbagi Google Drive atau artikel */
            zine: [{
                title: "Kebisingan Tak Selamanya Gangguan",
                desc: "Publikasi digital mandiri via Google Drive",
                url: "https://drive.google.com/file/d/1IcBQp6mmr-M7b_DyoXhSpRQ8MP3PTTlC/view?usp=drivesdk"
            }, {
                title: "THNKS GOD, I’M TI BOYS",
                desc: "Publikasi digital mandiri via Google Drive",
                url: "https://drive.google.com/file/d/1p9fajJkwNzYT5hztyFtnvnBnWUC99Oci/view?usp=drivesdk"
            }, {
                title: "TI FAMILIGA: Culture, Pride, dan Tanggung Jawab",
                desc: "Artikel · Kabar Frekuensi, 12 Juli 2026",
                url: "https://www.kabarfrekuensi.com/2026/07/ti-familiga-culture-pride-dan-tanggung.html"
            }],

            /* Song — tautan berbagi file dari Google Drive */
            song: [{
                title: "SING A LONG SUPER TI (Cover : Oi! GSQUAD - Sing a long PSIS)",
                desc: "Ketuk play untuk mendengarkan karya sederhana dari kami.",
                url: "https://drive.google.com/file/d/1_RVM3BUMTX5mfjDOELsUuwcd3Etc-xAI/view?usp=sharing"
            }],

            /* Galeri — tambah / hapus baris sesuka hati */
            gallery: {
                folder: "https://drive.google.com/drive/folders/1eXhStToDLrCzf9HGS1c0gNAk9JT-ewoo?usp=sharing",
                photos: [{
                    src: "doc/galeri 1.jpeg",
                    caption: "Dokumentasi 1"
                }, {
                    src: "doc/galeri 2.jpeg",
                    caption: "Dokumentasi 2"
                }, {
                    src: "doc/galeri3.jpeg",
                    caption: "Dokumentasi 3"
                }, {
                    src: "doc/galeri4.jpeg",
                    caption: "Dokumentasi 4"
                }]
            }
        };
        /* ===================== AKHIR PENGATURAN ===================== */

        const $ = (s, r = document) => r.querySelector(s);
        const PAGES = ["home", "zine", "song", "galeri"];
        const TITLES = {
            home: "",
            zine: "Zine — ",
            song: "Song — ",
            galeri: "Galeri — "
        };
        const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
        const ICON_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M9 9h6M9 13h6"/></svg>';

        function el(tag, props = {}, ...kids) {
            const n = document.createElement(tag);
            Object.entries(props).forEach(([k, v]) => {
                if (k === "class") n.className = v;
                else if (k === "html") n.innerHTML = v;
                else n.setAttribute(k, v);
            });
            kids.forEach(k => n.append(k));
            return n;
        }

        /* Taruh gambar di atas placeholder; jika gagal dimuat, placeholder tetap tampil */
        function overlayImg(slot, src, alt = "") {
            if (!src) return;
            const img = new Image();
            img.alt = alt;
            img.onload = () => slot.append(img);
            img.src = src;
        }

        let toastTimer;

        function toast(msg) {
            const t = $("#toast");
            t.textContent = msg;
            t.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
        }

        function driveId(url) {
            const m = url.match(/\/d\/([\w-]+)/) || url.match(/[?&]id=([\w-]+)/);
            return m ? m[1] : null;
        }

        /* ---------- Navigasi ---------- */
        function showPage(name) {
            if (!PAGES.includes(name)) name = "home";
            document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "page-" + name));
            document.querySelectorAll(".nav button").forEach(b => {
                if (b.dataset.page === name) b.setAttribute("aria-current", "page");
                else b.removeAttribute("aria-current");
            });
            document.title = TITLES[name] + "YP23 CREW · Yapping Youth Crew 23";
            window.scrollTo(0, 0);
        }

        function go(name) {
            location.hash = name === "home" ? "" : name;
            if (!location.hash) showPage("home");
        }
        window.addEventListener("hashchange", () => showPage(location.hash.slice(1)));
        document.querySelectorAll("[data-page]").forEach(b => b.addEventListener("click", () => go(b.dataset.page)));
        document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", e => {
            e.preventDefault();
            go(b.dataset.go);
        }));
        $("#btn-profil").addEventListener("click", e => {
            e.preventDefault();
            $("#profil").scrollIntoView({
                behavior: "smooth"
            });
        });

        /* ---------- Gambar ---------- */
        overlayImg($("#logo-slot"), CONFIG.logo, "Logo YP23 Crew");
        overlayImg($("#cover-slot"), CONFIG.cover, "Sampul YP23 Crew");
        overlayImg($("#about-slot"), CONFIG.aboutImage, "Foto YP23 Crew");

        /* ---------- Profil ---------- */
        $("#profile-story").textContent = CONFIG.profile.story;

        /* ---------- Zine ---------- */
        CONFIG.zine.forEach(z => {
            const btn = el("button", {
                class: "act",
                type: "button"
            }, "Baca");
            btn.addEventListener("click", () => z.url ? window.open(z.url, "_blank", "noopener") : toast("Tautan belum tersedia."));
            $("#zine-list").append(el("div", {
                    class: "item"
                },
                el("div", {
                    class: "item-icon",
                    html: ICON_DOC
                }),
                el("div", {}, el("strong", {}, z.title), el("small", {}, z.desc)),
                btn));
        });

        /* ---------- Song ---------- */
        const vDlg = $("#video-dialog"),
            vFrame = $("#video-frame");
        CONFIG.song.forEach(s => {
            const btn = el("button", {
                class: "act",
                type: "button"
            }, "Putar");
            btn.addEventListener("click", () => {
                if (!s.url) return toast("Tautan belum tersedia.");
                const id = driveId(s.url);
                if (!id) return window.open(s.url, "_blank", "noopener");
                $("#video-title").textContent = s.title;
                $("#video-open").href = s.url;
                vFrame.src = "https://drive.google.com/file/d/" + id + "/preview";
                vDlg.showModal();
            });
            $("#song-list").append(el("div", {
                    class: "item song"
                },
                el("div", {
                    class: "item-icon",
                    html: ICON_PLAY
                }),
                el("div", {}, el("strong", {}, s.title), el("small", {}, s.desc)),
                btn));
        });
        vDlg.addEventListener("close", () => {
            vFrame.src = "about:blank";
        });

        /* ---------- Galeri ---------- */
        const pDlg = $("#photo-dialog");
        CONFIG.gallery.photos.forEach((p, i) => {
            const slot = el("div", {
                class: "img-slot"
            }, String(i + 1));
            overlayImg(slot, p.src, p.caption);
            const tile = el("button", {
                class: "tile",
                type: "button",
                "aria-label": "Perbesar " + p.caption
            }, slot);
            tile.addEventListener("click", () => {
                if (!p.src) return toast("Foto belum tersedia.");
                $("#photo-title").textContent = p.caption;
                const im = $("#photo-img");
                im.src = p.src;
                im.alt = p.caption;
                pDlg.showModal();
            });
            $("#gallery").append(tile);
        });
        $("#gallery-folder").addEventListener("click", e => {
            const url = CONFIG.gallery.folder;
            if (!url) {
                e.preventDefault();
                return toast("Tautan belum tersedia.");
            }
            e.currentTarget.href = url;
            e.currentTarget.target = "_blank";
            e.currentTarget.rel = "noopener noreferrer";
        });

        /* ---------- Dialog: tombol tutup & klik di luar ---------- */
        document.querySelectorAll("dialog").forEach(d => {
            d.addEventListener("click", e => {
                if (e.target === d || e.target.hasAttribute("data-close")) d.close();
            });
        });

        showPage(location.hash.slice(1));
    </script>
</body>

</html>
